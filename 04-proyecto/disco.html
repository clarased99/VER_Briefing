<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbena — 04. Sobre el proyecto (Disco)</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/favicon/favicon-512.png">
    <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
    <link rel="alternate icon" href="../favicon.ico">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-section="04" data-tipo="DISCO">

<header class="page-header">
    <button class="menu-icon" aria-label="Abrir menú de navegación" aria-haspopup="true" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <div class="breadcrumbs">
        <span id="breadcrumb-empresa" hidden></span>
        <span id="breadcrumb-tipo" hidden></span>
        <span id="breadcrumb-proyecto" hidden></span>
    </div>
</header>

<main class="page-main">
    <h1 class="section-title">04. SOBRE EL PROYECTO</h1>
    <p class="section-subtitle">DISCO</p>

    <form class="form-grid" novalidate>

        <div class="field">
            <label for="historia-grupo">¿Cuál es la historia del grupo?</label>
            <textarea id="historia-grupo"></textarea>
        </div>

        <div class="field">
            <label for="cuando-grupo">¿Cuándo se formó?</label>
            <input type="text" id="cuando-grupo">
        </div>

        <div class="field">
            <label for="origen-nombre-grupo">¿De dónde viene el nombre del grupo?</label>
            <textarea id="origen-nombre-grupo"></textarea>
        </div>

        <div class="field">
            <label for="filosofia-grupo">¿Cuál es la filosofía de tu grupo? Define cuáles son sus valores.</label>
            <textarea id="filosofia-grupo"></textarea>
        </div>

    </form>

    <!-- Fotografía condicional -->
    <div class="field">
        <label>¿Necesitas fotografías?</label>
        <div style="display: flex; gap: var(--space-lg);">
            <div class="checkbox-row">
                <input type="checkbox" id="foto-disco-si" name="foto-disco" value="Sí">
                <label for="foto-disco-si">Sí</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="foto-disco-no" name="foto-disco" value="No">
                <label for="foto-disco-no">No</label>
            </div>
        </div>
    </div>

    <form class="form-grid" id="bloque-foto-disco" hidden novalidate>
        <div class="field">
            <label for="que-foto-disco">¿Qué necesitas fotografiar?</label>
            <input type="text" id="que-foto-disco" placeholder="Productos, espacios, personas, arquitectura...">
        </div>
        <div class="field">
            <label for="objetivos-foto-disco">¿Qué objetivos quieres conseguir con las fotografías?</label>
            <textarea id="objetivos-foto-disco"></textarea>
        </div>
        <div class="field">
            <label for="uso-foto-disco">¿Qué vas a hacer con las fotografías?</label>
            <input type="text" id="uso-foto-disco" placeholder="Web, redes, impresión...">
        </div>
        <div class="field">
            <label for="resolucion-foto-disco">¿Necesitas resolución, proporción o tamaño concreto?</label>
            <input type="text" id="resolucion-foto-disco">
        </div>
        <div class="field">
            <label for="comunicar-foto-disco">¿Qué quieres comunicar con las fotografías?</label>
            <textarea id="comunicar-foto-disco"></textarea>
        </div>
        <div class="field">
            <label for="mensaje-foto-disco">Mensaje clave de las fotografías</label>
            <input type="text" id="mensaje-foto-disco">
        </div>
        <div class="field">
            <label for="tono-foto-disco">¿Qué tono quieres dar a las fotografías?</label>
            <input type="text" id="tono-foto-disco">
        </div>
        <div class="field">
            <label for="aportaciones-foto-disco">Otras aportaciones que consideres de interés</label>
            <textarea id="aportaciones-foto-disco"></textarea>
        </div>
    </form>

    <!-- Aplicaciones -->
    <div class="field">
        <label>¿Qué aplicaciones necesitas?</label>
        <div style="display: flex; flex-wrap: wrap; gap: var(--space-sm);">
            <div class="checkbox-row"><input type="checkbox" id="app-disco"><label for="app-disco">Disco</label></div>
            <div class="checkbox-row"><input type="checkbox" id="app-disco-redes"><label for="app-disco-redes">Adaptación a redes</label></div>
            <div class="checkbox-row"><input type="checkbox" id="app-disco-stories"><label for="app-disco-stories">Adaptación a Stories</label></div>
            <div class="checkbox-row"><input type="checkbox" id="app-disco-noclaro"><label for="app-disco-noclaro">Aún no lo tengo claro</label></div>
            <div class="checkbox-row has-otro">
                <input type="checkbox" id="app-disco-otro-check">
                <label for="app-disco-otro-check">Otro</label>
                <div class="otro-field-inline" id="app-disco-otro-wrap">
                    <input type="text" id="app-disco-otro" placeholder="Especifica...">
                </div>
            </div>
        </div>
    </div>

    <div class="page-nav-next">
        <a href="../otro-tipo.html" class="btn-text" id="btn-siguiente">SIGUIENTE</a>
    </div>
</main>

<div id="brand-footer-text"></div>
<div id="brand-footer-logo"></div>

<script src="../js/nav.js" defer></script>
<script src="../js/state.js"></script>
<script src="../js/main.js" defer></script>
<script src="../js/footer.js" defer></script>
<script>
    const fotoChecks = document.querySelectorAll('input[name="foto-disco"]');
    const bloqueFoto = document.getElementById('bloque-foto-disco');
    fotoChecks.forEach((cb) => {
        cb.addEventListener('change', () => {
            if (cb.checked) fotoChecks.forEach(c => { if (c !== cb) c.checked = false; });
            bloqueFoto.hidden = !document.getElementById('foto-disco-si').checked;
        });
    });

    const cbOtro = document.getElementById('app-disco-otro-check');
    const wrapOtro = document.getElementById('app-disco-otro-wrap');
    cbOtro.addEventListener('change', () => {
        wrapOtro.classList.toggle('visible', cbOtro.checked);
        if (!cbOtro.checked) wrapOtro.querySelector('input').value = '';
    });

    document.getElementById('btn-siguiente').addEventListener('click', () => {
        VerbenaState.saveAllFieldsOnPage();
    });
</script>
</body>
</html>
