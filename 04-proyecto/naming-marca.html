<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbena — 04. Sobre el proyecto (Naming)</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/favicon/favicon-512.png">
    <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
    <link rel="alternate icon" href="../favicon.ico">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-section="04" data-tipo="NAMING + MARCA">

<header class="page-header">
    <button class="menu-icon" aria-label="Abrir menú de navegación" aria-haspopup="true" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <div class="breadcrumbs">
        <span id="breadcrumb-empresa" hidden></span>
        <span id="breadcrumb-tipo" hidden></span>
        <span id="breadcrumb-proyecto" hidden></span>
    </div>
</header>

<main class="page-main">
    <h1 class="section-title">04. SOBRE EL PROYECTO</h1>
    <p class="section-subtitle">NAMING</p>
    <p class="section-notice">Tómatelo con calma: no es necesario contestar todas las preguntas. Eso sí, cuanto más detalle nos des, mejor podremos ajustarnos a lo que necesitas.</p>

    <form class="form-grid" novalidate>

        <div class="field">
            <label for="objetivo-naming">¿Cuál es el objetivo principal de este proyecto?</label>
            <textarea id="objetivo-naming"></textarea>
        </div>

        <div class="field">
            <label for="tipo-nombre">¿Qué tipo de nombre buscas?</label>
            <div class="checkbox-row">
                <input type="checkbox" id="nombre-descriptivo" name="tipo-nombre">
                <label for="nombre-descriptivo">Descriptivo (explica lo que hace la marca)</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="nombre-evocador" name="tipo-nombre">
                <label for="nombre-evocador">Evocador (sugiere sensaciones o valores)</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="nombre-abstracto" name="tipo-nombre">
                <label for="nombre-abstracto">Abstracto (sin significado literal, original)</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="nombre-fundador" name="tipo-nombre">
                <label for="nombre-fundador">Basado en el nombre del fundador/a</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="nombre-noclaro" name="tipo-nombre">
                <label for="nombre-noclaro">Aún no lo tengo claro</label>
            </div>
        </div>

        <div class="field">
            <label for="palabras-clave-naming">¿Qué palabras clave o conceptos asocias a tu marca?</label>
            <textarea id="palabras-clave-naming" placeholder="Escribe todas las que se te ocurran, sin filtros"></textarea>
        </div>

        <div class="field">
            <label for="idioma-nombre">¿En qué idioma o idiomas debe funcionar el nombre?</label>
            <input type="text" id="idioma-nombre" placeholder="ej. Español, inglés, que funcione en ambos...">
        </div>

        <div class="field">
            <label for="evitar-naming">¿Hay algo que quieras evitar en el nombre? (palabras, sonidos, referencias...)</label>
            <textarea id="evitar-naming"></textarea>
        </div>

        <div class="field">
            <label for="nombres-gustan">¿Hay nombres de marcas que te gusten, aunque no sean de tu sector? ¿Por qué?</label>
            <textarea id="nombres-gustan"></textarea>
        </div>

        <div class="field">
            <label for="personalidad-naming">¿Cómo describirías la personalidad de tu marca?</label>
            <textarea id="personalidad-naming"></textarea>
        </div>

        <div class="field">
            <label>¿Qué tono de comunicación debe tener la marca?</label>
            <div class="checkbox-row"><input type="checkbox" id="tono-naming-cercano" name="tono-naming" value="Cercano"><label for="tono-naming-cercano">Cercano</label></div>
            <div class="checkbox-row"><input type="checkbox" id="tono-naming-formal" name="tono-naming" value="Formal"><label for="tono-naming-formal">Formal</label></div>
            <div class="checkbox-row"><input type="checkbox" id="tono-naming-tecnico" name="tono-naming" value="Técnico"><label for="tono-naming-tecnico">Técnico</label></div>
            <div class="checkbox-row"><input type="checkbox" id="tono-naming-irreverente" name="tono-naming" value="Irreverente"><label for="tono-naming-irreverente">Irreverente</label></div>
            <div class="checkbox-row"><input type="checkbox" id="tono-naming-inspiracional" name="tono-naming" value="Inspiracional"><label for="tono-naming-inspiracional">Inspiracional</label></div>
            <div class="checkbox-row"><input type="checkbox" id="tono-naming-divertido" name="tono-naming" value="Divertido"><label for="tono-naming-divertido">Divertido</label></div>
            <div class="checkbox-row has-otro">
                <input type="checkbox" id="tono-naming-otro-check" name="tono-naming" value="Otro">
                <label for="tono-naming-otro-check">Otro</label>
                <div class="otro-field-inline" id="tono-naming-otro-wrap">
                    <input type="text" id="tono-naming-otro" placeholder="Especifica...">
                </div>
            </div>
            <input type="hidden" id="tono-naming">
        </div>

        <div class="field">
            <label for="marcas-admira-naming">¿Qué marcas admiras o te inspiran visualmente?</label>
            <textarea id="marcas-admira-naming"></textarea>
        </div>

        <div class="field" style="grid-column: 1 / -1;">
            <label for="aportaciones-naming">Cualquier otro detalle que creas que puede ayudarnos</label>
            <textarea id="aportaciones-naming"></textarea>
        </div>

    </form>

    <div class="page-nav-next">
        <a href="../otro-tipo.html" class="btn-text" id="btn-siguiente">SIGUIENTE</a>
    </div>
</main>

<div id="brand-footer-text"></div>
<div id="brand-footer-logo"></div>

<script src="../js/nav.js" defer></script>
<script src="../js/state.js"></script>
<script src="../js/main.js" defer></script>
<script src="../js/footer.js" defer></script>
<script>
    // Tipo de nombre: selección única exclusiva
    document.querySelectorAll('input[name="tipo-nombre"]').forEach((cb) => {
        cb.addEventListener('change', function () {
            if (this.checked) {
                document.querySelectorAll('input[name="tipo-nombre"]')
                    .forEach(c => { if (c !== this) c.checked = false; });
            }
        });
    });

    // Tono naming: selección única exclusiva
    const tonoNamingChecks = document.querySelectorAll('input[name="tono-naming"]');
    const tonoNamingHidden = document.getElementById('tono-naming');
    const tonoNamingOtroWrap = document.getElementById('tono-naming-otro-wrap');

    tonoNamingChecks.forEach((cb) => {
        cb.dataset.vbExclude = 'true';
        cb.addEventListener('change', () => {
            if (cb.checked) {
                tonoNamingChecks.forEach(c => { if (c !== cb) c.checked = false; });
            }
            const seleccionado = Array.from(tonoNamingChecks).find(c => c.checked);
            const esOtro = document.getElementById('tono-naming-otro-check').checked;
            tonoNamingOtroWrap.classList.toggle('visible', esOtro);
            if (!esOtro && document.getElementById('tono-naming-otro')) {
                document.getElementById('tono-naming-otro').value = '';
            }
            tonoNamingHidden.value = seleccionado
                ? (seleccionado.value === 'Otro' ? (document.getElementById('tono-naming-otro')?.value?.trim() || 'Otro') : seleccionado.value)
                : '';
        });
    });

    document.getElementById('tono-naming-otro')?.addEventListener('input', () => {
        if (document.getElementById('tono-naming-otro-check').checked) {
            tonoNamingHidden.value = document.getElementById('tono-naming-otro').value.trim() || 'Otro';
        }
    });

    document.getElementById('btn-siguiente').addEventListener('click', () => {
        VerbenaState.saveAllFieldsOnPage();
    });
</script>
</body>
</html>
