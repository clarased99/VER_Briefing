<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbena — 04. Sobre el proyecto (Redes Sociales)</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-section="04" data-tipo="REDES">

<header class="page-header">
    <button class="menu-icon" aria-label="Abrir menú de navegación" aria-haspopup="true" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <div class="breadcrumbs">
        <span id="breadcrumb-empresa" hidden></span>
        <span id="breadcrumb-tipo" hidden></span>
        <span id="breadcrumb-proyecto" hidden></span>
    </div>
</header>

<main class="page-main">
    <h1 class="section-title">04. SOBRE EL PROYECTO</h1>
    <p class="section-subtitle">REDES SOCIALES</p>

    <form class="form-grid" novalidate>

        <div class="field" style="grid-column: 1 / -1;">
            <label>¿En qué redes sociales quieres estar presente?</label>
            <div style="display: flex; flex-wrap: wrap; gap: var(--space-sm);">
                <div class="checkbox-row"><input type="checkbox" id="red-instagram"><label for="red-instagram">Instagram</label></div>
                <div class="checkbox-row"><input type="checkbox" id="red-tiktok"><label for="red-tiktok">TikTok</label></div>
                <div class="checkbox-row"><input type="checkbox" id="red-linkedin"><label for="red-linkedin">LinkedIn</label></div>
                <div class="checkbox-row"><input type="checkbox" id="red-facebook"><label for="red-facebook">Facebook</label></div>
                <div class="checkbox-row"><input type="checkbox" id="red-x"><label for="red-x">X (Twitter)</label></div>
                <div class="checkbox-row"><input type="checkbox" id="red-youtube"><label for="red-youtube">YouTube</label></div>
                <div class="checkbox-row"><input type="checkbox" id="red-pinterest"><label for="red-pinterest">Pinterest</label></div>
                <div class="checkbox-row has-otro">
                    <input type="checkbox" id="red-otro-check">
                    <label for="red-otro-check">Otra</label>
                    <div class="otro-field-inline" id="red-otro-wrap">
                        <input type="text" id="red-otro" placeholder="Especifica...">
                    </div>
                </div>
            </div>
        </div>

        <div class="field">
            <label for="objetivo-redes">¿Cuál es el objetivo principal de tu presencia en redes?</label>
            <textarea id="objetivo-redes"></textarea>
        </div>

        <div class="field">
            <label for="comunicar-redes">¿Qué quieres comunicar? ¿Qué tipo de contenido quieres publicar?</label>
            <textarea id="comunicar-redes"></textarea>
        </div>

        <div class="field">
            <label for="tono-redes">¿Qué tono debe tener la comunicación en redes?</label>
            <div class="checkbox-row"><input type="checkbox" id="tono-redes-cercano" name="tono-redes" value="Cercano"><label for="tono-redes-cercano">Cercano</label></div>
            <div class="checkbox-row"><input type="checkbox" id="tono-redes-profesional" name="tono-redes" value="Profesional"><label for="tono-redes-profesional">Profesional</label></div>
            <div class="checkbox-row"><input type="checkbox" id="tono-redes-divertido" name="tono-redes" value="Divertido"><label for="tono-redes-divertido">Divertido</label></div>
            <div class="checkbox-row"><input type="checkbox" id="tono-redes-inspiracional" name="tono-redes" value="Inspiracional"><label for="tono-redes-inspiracional">Inspiracional</label></div>
            <div class="checkbox-row has-otro">
                <input type="checkbox" id="tono-redes-otro-check" name="tono-redes" value="Otro">
                <label for="tono-redes-otro-check">Otro</label>
                <div class="otro-field-inline" id="tono-redes-otro-wrap">
                    <input type="text" id="tono-redes-otro" placeholder="Especifica...">
                </div>
            </div>
            <input type="hidden" id="tono-redes">
        </div>

        <div class="field">
            <label for="frecuencia-redes">¿Con qué frecuencia quieres publicar?</label>
            <input type="text" id="frecuencia-redes" placeholder="ej. 3 veces por semana, diariamente...">
        </div>

        <div class="field">
            <label for="cuentas-referencia">¿Hay cuentas que te gusten como referencia, aunque no sean de tu sector?</label>
            <textarea id="cuentas-referencia"></textarea>
        </div>

        <div class="field">
            <label for="contenido-existente">¿Tienes ya contenido (fotos, vídeos, textos) o hay que crearlo desde cero?</label>
            <textarea id="contenido-existente"></textarea>
        </div>

        <div class="field">
            <label>¿Necesitas plantillas para gestionar tú mismo las redes después?</label>
            <div style="display: flex; gap: var(--space-lg);">
                <div class="checkbox-row">
                    <input type="checkbox" id="plantillas-si" name="plantillas" value="Sí">
                    <label for="plantillas-si">Sí</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="plantillas-no" name="plantillas" value="No">
                    <label for="plantillas-no">No</label>
                </div>
            </div>
        </div>

        <div class="field" style="grid-column: 1 / -1;">
            <label for="aportaciones-redes">Cualquier otro detalle que creas relevante</label>
            <textarea id="aportaciones-redes"></textarea>
        </div>

    </form>

    <div class="page-nav-next">
        <a href="../otro-tipo.html" class="btn-text" id="btn-siguiente">SIGUIENTE</a>
    </div>
</main>

<div id="brand-footer-text"></div>
<div id="brand-footer-logo"></div>

<script src="../js/nav.js" defer></script>
<script src="../js/state.js"></script>
<script src="../js/main.js" defer></script>
<script src="../js/footer.js" defer></script>
<script>
    const cbOtro = document.getElementById('red-otro-check');
    const wrapOtro = document.getElementById('red-otro-wrap');
    cbOtro.addEventListener('change', () => {
        wrapOtro.classList.toggle('visible', cbOtro.checked);
        if (!cbOtro.checked) wrapOtro.querySelector('input').value = '';
    });

    // Tono: selección única (exclusiva)
    const tonoChecks = document.querySelectorAll('input[name="tono-redes"]');
    const tonoConsolidado = document.getElementById('tono-redes');
    const tonoOtroWrap = document.getElementById('tono-redes-otro-wrap');

    tonoChecks.forEach((cb) => {
        cb.dataset.vbExclude = 'true';
        cb.addEventListener('change', () => {
            if (cb.checked) {
                tonoChecks.forEach(c => { if (c !== cb) { c.checked = false; } });
            }
            const seleccionado = Array.from(tonoChecks).find(c => c.checked);
            tonoConsolidado.value = seleccionado ? seleccionado.value : '';
            // Mostrar campo libre si es "Otro"
            const esOtro = document.getElementById('tono-redes-otro-check').checked;
            tonoOtroWrap.classList.toggle('visible', esOtro);
            if (!esOtro) {
                const otroInput = document.getElementById('tono-redes-otro');
                if (otroInput) otroInput.value = '';
            }
        });
    });
    cb.addEventListener('change', function () {
        if (this.checked) {
            document.querySelectorAll('input[name="plantillas"]')
                .forEach(c => { if (c !== this) c.checked = false; });
        }
    });
    });

    document.getElementById('btn-siguiente').addEventListener('click', () => {
        VerbenaState.saveAllFieldsOnPage();
    });
</script>
</body>
</html>
