<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbena — 04. Sobre el proyecto (Marca)</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-section="04" data-tipo="MARCA">

<header class="page-header">
    <button class="menu-icon" aria-label="Abrir menú de navegación" aria-haspopup="true" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <div class="breadcrumbs">
        <span id="breadcrumb-empresa" hidden></span>
        <span id="breadcrumb-tipo" hidden></span>
        <span id="breadcrumb-proyecto" hidden></span>
    </div>
</header>

<main class="page-main">
    <h1 class="section-title">04. SOBRE EL PROYECTO</h1>
    <p class="section-subtitle">MARCA</p>

    <form class="form-grid" novalidate>

        <div class="field">
            <label for="objetivo-marca">¿Cuál es el objetivo principal de este proyecto de marca?</label>
            <textarea id="objetivo-marca"></textarea>
        </div>

        <div class="field" id="field-momento-marca">
            <label for="momento-marca">¿En qué momento se encuentra la marca? ¿Es una marca nueva o tiene recorrido previo?</label>
            <div class="checkbox-row">
                <input type="checkbox" id="marca-nueva" name="momento-marca">
                <label for="marca-nueva">Marca nueva, partimos desde cero</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="marca-rediseno" name="momento-marca">
                <label for="marca-rediseno">Rediseño / actualización de una marca existente</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="marca-extension" name="momento-marca">
                <label for="marca-extension">Extensión de una marca ya existente</label>
            </div>
        </div>

        <div class="field" id="field-marca-previa" hidden>
            <label for="marca-previa-desc">¿Qué tienes actualmente y qué te gustaría conservar o mejorar?</label>
            <textarea id="marca-previa-desc"></textarea>
        </div>

        <div class="field">
            <label for="esencia-marca">¿Cuál es la esencia de tu marca? ¿Qué la hace única?</label>
            <textarea id="esencia-marca"></textarea>
        </div>

        <div class="field">
            <label for="promesa-marca">¿Cuál es la promesa de tu marca hacia el cliente?</label>
            <textarea id="promesa-marca"></textarea>
        </div>

        <div class="field">
            <label for="marcas-no">¿Hay algún estilo visual o marca que definitivamente NO quieras que se parezca a la tuya?</label>
            <textarea id="marcas-no"></textarea>
        </div>

        <div class="field" style="grid-column: 1 / -1;">
            <label>¿Qué aplicaciones necesita la identidad de marca?</label>
            <div style="display: flex; flex-wrap: wrap; gap: var(--space-sm);">
                <div class="checkbox-row"><input type="checkbox" id="app-logo"><label for="app-logo">Logotipo / isotipo</label></div>
                <div class="checkbox-row"><input type="checkbox" id="app-papeleria"><label for="app-papeleria">Papelería corporativa</label></div>
                <div class="checkbox-row"><input type="checkbox" id="app-digital"><label for="app-digital">Aplicaciones digitales</label></div>
                <div class="checkbox-row"><input type="checkbox" id="app-senaletica"><label for="app-senaletica">Señalética / espacio físico</label></div>
                <div class="checkbox-row"><input type="checkbox" id="app-packaging"><label for="app-packaging">Packaging</label></div>
                <div class="checkbox-row"><input type="checkbox" id="app-manual"><label for="app-manual">Manual de marca</label></div>
                <div class="checkbox-row has-otro">
                    <input type="checkbox" id="app-marca-otro-check">
                    <label for="app-marca-otro-check">Otra</label>
                    <div class="otro-field-inline" id="app-marca-otro-wrap">
                        <input type="text" id="app-marca-otro" placeholder="Especifica...">
                    </div>
                </div>
            </div>
        </div>

        <div class="field" style="grid-column: 1 / -1;">
            <label for="aportaciones-marca">Cualquier otro detalle que creas que puede ayudarnos a entender mejor tu marca</label>
            <textarea id="aportaciones-marca"></textarea>
        </div>

    </form>

    <div class="page-nav-next">
        <a href="../otro-tipo.html" class="btn-text" id="btn-siguiente">SIGUIENTE</a>
    </div>
</main>

<div id="brand-footer-text"></div>
<div id="brand-footer-logo"></div>

<script src="../js/nav.js" defer></script>
<script src="../js/state.js"></script>
<script src="../js/main.js" defer></script>
<script src="../js/footer.js" defer></script>
<script>
    // Momento de la marca: selección única
    const momentoChecks = document.querySelectorAll('input[name="momento-marca"]');
    momentoChecks.forEach((cb) => {
        cb.addEventListener('change', () => {
            if (cb.checked) {
                momentoChecks.forEach(c => { if (c !== cb) c.checked = false; });
            }
            const alguno = document.getElementById('marca-rediseno').checked
                || document.getElementById('marca-extension').checked;
            document.getElementById('field-marca-previa').hidden = !alguno;
        });
    });

    const cbOtro = document.getElementById('app-marca-otro-check');
    const wrapOtro = document.getElementById('app-marca-otro-wrap');
    cbOtro.addEventListener('change', () => {
        wrapOtro.classList.toggle('visible', cbOtro.checked);
        if (!cbOtro.checked) wrapOtro.querySelector('input').value = '';
    });

    document.getElementById('btn-siguiente').addEventListener('click', () => {
        VerbenaState.saveAllFieldsOnPage();
    });
</script>
</body>
</html>
