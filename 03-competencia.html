<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbena — 03. Competencia</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon/favicon-512.png">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <link rel="alternate icon" href="favicon.ico">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">


</head>
<body data-section="03">

<header class="page-header">
    <button class="menu-icon" aria-label="Abrir menú de navegación" aria-haspopup="true" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <div class="breadcrumbs">
        <span id="breadcrumb-empresa" hidden></span>
        <span id="breadcrumb-tipo" hidden></span>
        <span id="breadcrumb-proyecto" hidden></span>
    </div>
</header>

<main class="page-main">
    <h1 class="section-title">03. COMPETENCIA</h1>

    <div class="field">
        <label>¿Cuál es tu área de influencia?</label>
        <textarea id="area-influencia-texto" placeholder="ej. &quot;Cangas de Onís y alrededores&quot;, &quot;toda España&quot;, &quot;online, sin límite geográfico&quot;..."></textarea>
    </div>

    <form class="form-grid" id="bloque-competidores" novalidate>
        <div class="field" style="grid-column: 1 / -1;">
            <label>¿Cuál es tu competencia real?<br>Describe y menciona las empresas que son competencia tuya directa, por tipo de empresa.</label>
            <div id="competencia-real-lista"></div>
            <button type="button" class="btn-add-row" data-target="competencia-real-lista" data-prefix="comp-real">+ Añadir competidor</button>
        </div>

        <div class="field" style="grid-column: 1 / -1;">
            <label>¿Y tu competencia aspiracional?<br>Describe la competencia que, ahora mismo NO tienes pero que te gustaría tener.</label>
            <div id="competencia-aspiracional-lista"></div>
            <button type="button" class="btn-add-row" data-target="competencia-aspiracional-lista" data-prefix="comp-aspiracional">+ Añadir competidor</button>
        </div>

        <div class="field" style="grid-column: 1 / -1;">
            <label>¿A quién de tus competidores te gustaría parecer y por qué?</label>
            <div id="competencia-referente-lista"></div>
            <button type="button" class="btn-add-row" data-target="competencia-referente-lista" data-prefix="comp-referente">+ Añadir competidor</button>
        </div>
    </form>

    <!-- ==========================================================
         BLOQUES CONDICIONALES SEGÚN TIPO DE PROYECTO
         Se muestran solo si el cliente eligió Publicación, Cartel
         o Disco en la pantalla de selección de tipo de proyecto.
         ========================================================== -->

    <form class="form-grid" id="bloque-publicacion" hidden novalidate>
        <div class="field">
            <label for="publicaciones-similares">¿Conoces otras publicaciones similares? Enuméralas.</label>
            <textarea id="publicaciones-similares" name="publicaciones-similares"></textarea>
        </div>
        <div class="field">
            <label for="publicacion-asemejar">¿A qué publicación buscas que se asemeje este proyecto?</label>
            <textarea id="publicacion-asemejar" name="publicacion-asemejar"></textarea>
        </div>
    </form>

    <form class="form-grid" id="bloque-cartel" hidden novalidate>
        <div class="field">
            <label for="cartel-referentes">Indícanos referentes para vuestro proyecto y por qué</label>
            <textarea id="cartel-referentes" name="cartel-referentes"></textarea>
        </div>
        <div class="field">
            <label for="cartel-influencias">¿Qué influencias tenéis en otros campos?</label>
            <textarea id="cartel-influencias" name="cartel-influencias"></textarea>
        </div>
    </form>

    <form class="form-grid" id="bloque-disco" hidden novalidate>
        <div class="field">
            <label for="disco-referentes">¿Qué grupos son referentes para vuestro proyecto y por qué?</label>
            <textarea id="disco-referentes" name="disco-referentes"></textarea>
        </div>
        <div class="field">
            <label for="disco-influencias">¿Qué influencias tenéis en otros campos?</label>
            <textarea id="disco-influencias" name="disco-influencias"></textarea>
        </div>
    </form>

    <div class="page-nav-next">
        <button type="button" class="btn-text" id="btn-siguiente">SIGUIENTE</button>
    </div>
</main>

<div id="brand-footer-text"></div>
<div id="brand-footer-logo"></div>

<script src="js/nav.js" defer></script>
<script src="js/state.js"></script>
<script src="js/main.js" defer></script>
<script src="js/footer.js" defer></script>

<script>
    /* ============================================================
       TABLAS DINÁMICAS DE COMPETIDORES (Competidor / Descripción)
       Patrón reutilizable: cada lista empieza vacía, el botón
       "+ Añadir" inserta una nueva fila de 2 campos.
       ============================================================ */
    function crearFilaCompetidor(prefix, index) {
        const row = document.createElement('div');
        row.className = 'dynamic-table-row';

        const inputCompetidor = document.createElement('input');
        inputCompetidor.type = 'text';
        inputCompetidor.id = `${prefix}-nombre-${index}`;
        inputCompetidor.placeholder = 'Competidor';

        const inputDescripcion = document.createElement('input');
        inputDescripcion.type = 'text';
        inputDescripcion.id = `${prefix}-desc-${index}`;
        inputDescripcion.placeholder = 'Descripción';

        row.appendChild(inputCompetidor);
        row.appendChild(inputDescripcion);
        return row;
    }

    const LISTAS_COMPETIDORES = [
        { btnTarget: 'competencia-real-lista',         prefix: 'comp-real' },
        { btnTarget: 'competencia-aspiracional-lista',  prefix: 'comp-aspiracional' },
        { btnTarget: 'competencia-referente-lista',     prefix: 'comp-referente' },
    ];

    // Counters por lista
    const contadores = {};

    function guardarCount(prefix) {
        localStorage.setItem('vb_dyn_comp-count-' + prefix, contadores[prefix] || 1);
    }

    document.querySelectorAll('.btn-add-row').forEach((btn) => {
        const prefix = btn.dataset.prefix;
        contadores[prefix] = contadores[prefix] || 0;
        btn.addEventListener('click', () => {
            contadores[prefix]++;
            const target = document.getElementById(btn.dataset.target);
            target.appendChild(crearFilaCompetidor(prefix, contadores[prefix]));
            guardarCount(prefix);
        });
    });

    function inicializarFilasCompetidores() {
        const bloque = document.getElementById('bloque-competidores');
        if (bloque.hidden) return;

        LISTAS_COMPETIDORES.forEach(({ btnTarget, prefix }) => {
            const lista = document.getElementById(btnTarget);
            if (!lista) return;

            // Si ya hay filas, no crear más (venimos del historial del navegador)
            if (lista.querySelector('.dynamic-table-row')) return;

            const savedCount = parseInt(localStorage.getItem('vb_dyn_comp-count-' + prefix) || '1', 10);
            contadores[prefix] = savedCount;

            for (let i = 1; i <= savedCount; i++) {
                lista.appendChild(crearFilaCompetidor(prefix, i));
            }
        });

        // Rellenar los valores guardados
        VerbenaState.restoreAllFieldsOnPage();

        // Guardar al cambiar
        document.getElementById('bloque-competidores').addEventListener('input', () => {
            LISTAS_COMPETIDORES.forEach(({ prefix }) => guardarCount(prefix));
        });
    }

    /* ============================================================
       BLOQUES CONDICIONALES SEGÚN TIPO DE PROYECTO
       ============================================================ */
    const tiposElegidos = VerbenaState.getTiposProyecto().map((t) => t.toUpperCase());

    const TIPOS_SIN_COMPETIDORES = ['PUBLICACIÓN', 'CARTEL', 'DISCO'];
    const ocultarCompetidores = tiposElegidos.every((t) =>
        TIPOS_SIN_COMPETIDORES.includes(t)
    );

    if (ocultarCompetidores) {
        document.getElementById('bloque-competidores').hidden = true;
    }

    if (tiposElegidos.includes('PUBLICACIÓN')) {
        document.getElementById('bloque-publicacion').hidden = false;
    }
    if (tiposElegidos.includes('CARTEL')) {
        document.getElementById('bloque-cartel').hidden = false;
    }
    if (tiposElegidos.includes('DISCO')) {
        document.getElementById('bloque-disco').hidden = false;
    }

    inicializarFilasCompetidores();

    /* ============================================================
       GUARDADO AL AVANZAR
       ============================================================ */
    document.getElementById('btn-siguiente').addEventListener('click', () => {
        VerbenaState.saveAllFieldsOnPage();
        const destino = VerbenaState.getUrlPrimerTipo() || 'tipo-proyecto.html';
        window.location.href = destino;
    });
</script>
</body>
</html>
