<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbena — 06. Conclusiones</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon/favicon-512.png">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <link rel="alternate icon" href="favicon.ico">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-section="06">

<header class="page-header">
    <button class="menu-icon" aria-label="Abrir menú de navegación" aria-haspopup="true" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <div class="breadcrumbs">
        <span id="breadcrumb-empresa" hidden></span>
        <span id="breadcrumb-tipo" hidden></span>
        <span id="breadcrumb-proyecto" hidden></span>
    </div>
</header>

<main class="page-main">
    <h1 class="section-title">06. CONCLUSIONES</h1>

    <div class="conclusiones-intro">
        <p>Cualquier comentario o información que creas que no has podido expresar seguro que nos puede ayudar a tener una idea más exacta. Cuéntanos…</p>
        <p>Cualquier referencia/inspiración que hayas tenido será bienvenida.</p>
    </div>

    <div class="field conclusiones-archivos">
        <div id="archivos-lista">
            <div class="archivo-fila">
                <input type="file" class="archivo-input" accept="image/*,.pdf,.zip,.ai,.eps,.sketch,.fig">
                <button type="button" class="btn-examinar">EXAMINAR...</button>
                <span class="archivo-nombre-label"></span>
            </div>
        </div>
        <button type="button" class="btn-add-row" id="btn-add-archivo">+ Añadir otro archivo</button>
        <p class="archivos-wetransfer">* También puedes enviar un <a href="https://wetransfer.com" target="_blank" rel="noopener">wetransfer</a> a <a href="mailto:hola@colectivoverbena.info">hola@colectivoverbena.info</a></p>
    </div>

    <div class="field">
        <label for="aportacion-adicional">¿Alguna aclaración o aportación adicional?</label>
        <textarea id="aportacion-adicional" rows="5"></textarea>
    </div>

    <div class="page-nav-next">
        <button type="button" class="btn-text" id="btn-enviar">ENVIAR</button>
    </div>

    <div id="envio-estado" hidden>
        <p id="envio-mensaje"></p>
    </div>
</main>

<div id="brand-footer-text"></div>
<div id="brand-footer-logo"></div>

<iframe name="hidden-iframe" style="display:none"></iframe>

<script src="js/nav.js" defer></script>
<script src="js/state.js"></script>
<script src="js/main.js" defer></script>
<script src="js/footer.js" defer></script>
<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbziMwlzjwXqhpeeGrmakB-zz8Br0Cwd3IdjK4yfyuqJ2QPuIbP770H3WucqM61xTLk/exec';

    // ---- Gestión de múltiples archivos ----
    const archivosLista = document.getElementById('archivos-lista');

    function initFilaArchivo(fila) {
        const input  = fila.querySelector('.archivo-input');
        const btn    = fila.querySelector('.btn-examinar');
        const label  = fila.querySelector('.archivo-nombre-label');
        btn.addEventListener('click', () => input.click());
        input.addEventListener('change', () => {
            label.textContent = input.files[0] ? input.files[0].name : '';
        });
    }

    // Inicializar la primera fila
    initFilaArchivo(archivosLista.querySelector('.archivo-fila'));

    document.getElementById('btn-add-archivo').addEventListener('click', () => {
        const fila = document.createElement('div');
        fila.className = 'archivo-fila';
        fila.innerHTML = `
            <input type="file" class="archivo-input" accept="image/*,.pdf,.zip,.ai,.eps,.sketch,.fig">
            <button type="button" class="btn-examinar">EXAMINAR...</button>
            <span class="archivo-nombre-label"></span>
        `;
        archivosLista.appendChild(fila);
        initFilaArchivo(fila);
    });

    // ---- Convertir archivo a base64 ----
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload  = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // ---- Envío final ----
    document.getElementById('btn-enviar').addEventListener('click', async () => {
        const btnEnviar = document.getElementById('btn-enviar');
        btnEnviar.textContent = 'ENVIANDO...';
        btnEnviar.style.opacity = '0.5';
        btnEnviar.disabled = true;

        try { VerbenaState.saveAllFieldsOnPage(); } catch(e) { console.error('saveAll', e); }

        // Recoger imágenes para el moodboard
        try {
            const CAMPOS_IMAGEN = ['textura','colores','formas','imagen-1','imagen-2','imagen-3','imagen-4','imagen-5','imagen-6'];
            const imgs = CAMPOS_IMAGEN
                .map(id => VerbenaState.getField(id))
                .filter(Boolean)
                .flatMap(val => val.split(' + '))
                .filter(val => val.includes('=IMAGE(') || val.startsWith('http'));
            sessionStorage.setItem('vb_moodboard', JSON.stringify(imgs));
        } catch(e) { console.error('moodboard', e); }

        // Recoger y convertir archivos a base64
        const archivos = [];
        try {
            const inputs = archivosLista.querySelectorAll('.archivo-input');
            for (const input of inputs) {
                if (input.files[0]) {
                    const file = input.files[0];
                    const base64 = await fileToBase64(file);
                    archivos.push({ nombre: file.name, mimeType: file.type || 'application/octet-stream', base64 });
                }
            }
        } catch(e) { console.error('archivos', e); }

        // Enviar via form POST oculto (funciona cross-origin sin restricciones CORS)
        try {
            const datos = VerbenaState.collectAllData();
            const bodyStr = JSON.stringify({ datos, archivos });

            const form = document.createElement('form');
            form.method = 'POST';
            form.action = APPS_SCRIPT_URL;
            form.target = 'hidden-iframe'; // evita redirigir la página
            form.style.display = 'none';

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'payload';
            input.value = bodyStr;

            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();

            // Esperar a que el GS procese
            await new Promise(resolve => setTimeout(resolve, 4000));
            document.body.removeChild(form);
        } catch(e) { console.error('form post', e); }

        try { VerbenaState.clearAll(); } catch(e) { console.error('clearAll', e); }

        window.location.href = 'final.html';
    });
</script>
</body>
</html>
