<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbena — Tipo de proyecto</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="page-header">
    <div class="breadcrumbs">
        <span id="breadcrumb-empresa" hidden></span>
        <span id="breadcrumb-proyecto" hidden></span>
    </div>
</header>

<main class="page-main">
    <h1 class="section-title">TIPO DE PROYECTO</h1>
    <p>* Si tienes más de un tipo de proyecto en mente, más tarde podrás añadirlo en el apartado final.</p>

    <div class="confetti-field" id="confetti-field" aria-label="Elige el tipo de proyecto"></div>
</main>

<div id="brand-footer-text"></div>
<div id="brand-footer-logo"></div>

<script src="js/state.js"></script>
<script src="js/main.js" defer></script>
<script src="js/footer.js" defer></script>
<script>
    /* ============================================================
       CONFIGURACIÓN DE TIPOS DE PROYECTO (confeti)
       Archivos reales exportados de Illustrator (sin texto, color
       y opacidad ya vienen en el propio SVG para el efecto de
       esquina doblada, pero pintamos vía currentColor + mask para
       mantener consistencia con el resto del sistema).

       "ratio" es el aspect-ratio real (ancho/alto) de cada SVG,
       calculado a partir de su viewBox, para que no se deforme.
       "escala" permite ajustar el tamaño de una pieza concreta
       respecto al resto (1 = tamaño base, 1.1 = 10% más grande).
       "destino" es la posición final (left/top en %) dentro del
       área de confeti, inspirada en la composición del wireframe.
       "delay" escalona el inicio de la caída de cada pieza.
       "slug" identifica el tipo en las URLs de 04-proyecto/ (se
       usa solo cuando se vuelve por el bucle "¿otro tipo?", ver
       lógica de navegación más abajo).
    ============================================================ */
    const TIPOS_PROYECTO = [
        { id: 'disco',        label: 'DISCO',          color: 'var(--color-naranja)', archivo: 'confeti-disco.svg',         ratio: 1.780, escala: 1,    destino: { left: '58%', top: '20%' }, rotacionFinal: '18deg',   delay: 0.0,  slug: 'disco' },
        { id: 'redes',        label: 'REDES',          color: 'var(--color-rojo)',    archivo: 'confeti-redes.svg',         ratio: 1.568, escala: 1,    destino: { left: '80%', top: '14%' }, rotacionFinal: '16deg',   delay: 0.15, slug: 'redes' },
        { id: 'publicacion',  label: 'PUBLICACIÓN',    color: 'var(--color-verde)',   archivo: 'confeti-publicacion.svg',   ratio: 1.831, escala: 1,    destino: { left: '24%', top: '24%' }, rotacionFinal: '-13deg',  delay: 0.3,  slug: 'publicacion' },
        { id: 'marca',        label: 'MARCA',          color: 'var(--color-morado)',  archivo: 'confeti-marca.svg',         ratio: 1.571, escala: 1,    destino: { left: '4%',  top: '26%' }, rotacionFinal: '16deg',   delay: 0.45, slug: 'marca' },
        { id: 'cartel',       label: 'CARTEL',         color: 'var(--color-amarillo)',archivo: 'confeti-cartel.svg',        ratio: 2.042, escala: 1,    destino: { left: '38%', top: '46%' }, rotacionFinal: '-5deg',   delay: 0.6,  slug: 'cartel' },
        { id: 'web',          label: 'WEB',            color: 'var(--color-morado)',  archivo: 'confeti-web.svg',           ratio: 2.537, escala: 1,    destino: { left: '75%', top: '48%' }, rotacionFinal: '-3deg',   delay: 0.75, slug: 'web' },
        { id: 'naming-marca', label: 'NAMING + MARCA', color: 'var(--color-azul)',    archivo: 'confeti-naming-marca.svg',  ratio: 1.859, escala: 1.1,  destino: { left: '8%',  top: '70%' }, rotacionFinal: '-15deg',  delay: 0.9,  slug: 'naming-marca' },
        { id: 'fotografia',   label: 'FOTOGRAFÍA',     color: 'var(--color-rojo)',    archivo: 'confeti-fotografia.svg',    ratio: 2.006, escala: 1,    destino: { left: '34%', top: '72%' }, rotacionFinal: '10deg',   delay: 1.05, slug: 'fotografia' },
        { id: 'video',        label: 'VÍDEO',          color: 'var(--color-verde)',   archivo: 'confeti-video.svg',         ratio: 1.542, escala: 1,    destino: { left: '64%', top: '74%' }, rotacionFinal: '17deg',   delay: 1.2,  slug: 'video' },
    ];

    const field = document.getElementById('confetti-field');
    const PIECE_WIDTH = 170; // ancho base en px; el alto se deriva del ratio real

    TIPOS_PROYECTO.forEach((tipo) => {
        const piece = document.createElement('button');
        piece.type = 'button';
        piece.className = 'confetti-piece';
        piece.style.left = tipo.destino.left;
        piece.style.top = tipo.destino.top;
        const width = PIECE_WIDTH * tipo.escala;
        piece.style.width = `${width}px`;
        piece.style.height = `${width / tipo.ratio}px`;
        piece.style.color = tipo.color;
        piece.style.setProperty('--final-rotation', tipo.rotacionFinal);
        piece.style.animationDelay = `${tipo.delay}s`;

        const shape = document.createElement('div');
        shape.className = 'confetti-piece__shape';
        shape.style.webkitMaskImage = `url('assets/confeti/${tipo.archivo}')`;
        shape.style.maskImage = `url('assets/confeti/${tipo.archivo}')`;

        const label = document.createElement('span');
        label.className = 'confetti-piece__label';
        label.textContent = tipo.label;

        piece.appendChild(shape);
        piece.appendChild(label);

        piece.addEventListener('click', () => {
            const esBucle = new URLSearchParams(window.location.search).get('bucle') === '1';
            if (!esBucle) {
                // Primera pasada: resetear siempre para evitar acumulación
                // si el usuario navega hacia atrás y elige otro tipo
                VerbenaState.resetTiposProyecto();
            }
            VerbenaState.addTipoProyecto(tipo.label);
            const destino = esBucle
                ? `04-proyecto/${tipo.slug}.html`
                : '03-competencia.html';
            window.location.href = destino;
        });

        field.appendChild(piece);
    });
</script>
</body>
</html>
